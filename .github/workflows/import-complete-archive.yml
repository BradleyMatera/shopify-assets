name: Verify complete asset package
# The one-time import is complete. Verify the permanent GitHub copy without
# depending on temporary Shopify transfer files or modifying the repository.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-complete-archive.yml'
      - 'complete-library/**'
      - 'production/complete-library-inventory.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-asset-package-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the complete library
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download the permanent original ZIP release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rma-package-verify"
          gh release download complete-asset-pack-2026-11-01 --pattern 'real-mall-assets-complete.zip' --dir "$RUNNER_TEMP/rma-package-verify"
      - name: Verify every original file and the complete release archive
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          expected = 'd2f5f5c4828d3e3876995779ce6e58791f4369ada66682941846eb3444891915'
          archive = Path(os.environ['RUNNER_TEMP']) / 'rma-package-verify/real-mall-assets-complete.zip'
          assert archive.stat().st_size == 186141158, 'Wrong release size'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Wrong release checksum'
          inventory = json.loads(Path('production/complete-library-inventory.json').read_text())
          assert len(inventory['files']) == 1323, 'Wrong package inventory count'
          base = Path('complete-library')
          with zipfile.ZipFile(archive) as z:
              members = [i for i in z.infolist() if not i.is_dir()]
              assert len(members) == 1323
              for member in members:
                  prefix = 'real-mall-assets-complete/'
                  assert member.filename.startswith(prefix)
                  relative = member.filename[len(prefix):]
                  assert not PurePosixPath(relative).is_absolute() and '..' not in PurePosixPath(relative).parts
                  assert (base / relative).read_bytes() == z.read(member), f'Missing or changed: {relative}'
          for entry in inventory['files']:
              data = (base / entry['path']).read_bytes()
              assert len(data) == entry['bytes']
              assert hashlib.sha256(data).hexdigest() == entry['sha256'], entry['path']
          manifest = json.loads((base / 'asset-manifest.json').read_text())
          count = sum(len(asset['variants']) for asset in manifest['assets'])
          assert count == 1302, 'Wrong media export count'
          print('VERIFIED: all 1,323 original files, 1,302 media exports, and the exact original ZIP.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Complete package verified\n\nAll **1,323 original files** match the release ZIP byte for byte. The **1,302 media exports** are included. The original ZIP SHA-256 matches. No temporary transfer service is required.\n')
          PY
