name: Import and verify complete asset package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-complete-archive.yml'
      - 'production/complete-archive-transfer.json'
      - 'scripts/import_complete_archive.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: complete-asset-package-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current repository without discarding existing work
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and verify every original package file
        id: import
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python scripts/import_complete_archive.py
      - name: Commit individual assets and verify their exact Git objects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          git add -f complete-library production/complete-library-inventory.json production/complete-library-verification.json README.md ALL-ASSETS.md START-HERE.html
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete asset package: 1,323 verified files, 1,302 media exports'
          fi
          python scripts/import_complete_archive.py --verify-ref HEAD
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python scripts/import_complete_archive.py --verify-ref HEAD
            if git push origin HEAD:main; then pushed=true; break; fi
          done
          test "$pushed" = true
          git fetch origin main
          python scripts/import_complete_archive.py --verify-ref origin/main
      - name: Publish the exact original ZIP and checksum as a release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.import.outputs.archive }}
          CHECKSUM: ${{ steps.import.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          tag='complete-asset-pack-2026-11-01'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$(git rev-parse HEAD)" --title 'Complete asset package — all 1,323 original files' --notes 'Exact original 186,141,158-byte asset ZIP, SHA-256 d2f5f5c4828d3e3876995779ce6e58791f4369ada66682941846eb3444891915. All 1,323 package files are also extracted in complete-library/ on main, including 1,302 registered media exports. Existing assets are preserved. Reference concepts, small crops and enlarged derivatives retain their original labels. This is the full supplied package, not a claim that new photographic production or Shopify deployment is complete.'
          fi
          gh release upload "$tag" "$ARCHIVE" "$CHECKSUM" --clobber
          mkdir -p "$RUNNER_TEMP/rma-release-readback"
          gh release download "$tag" --pattern 'real-mall-assets-complete.zip' --dir "$RUNNER_TEMP/rma-release-readback" --clobber
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = 'd2f5f5c4828d3e3876995779ce6e58791f4369ada66682941846eb3444891915'
          downloaded = Path(os.environ['RUNNER_TEMP']) / 'rma-release-readback/real-mall-assets-complete.zip'
          actual = hashlib.sha256(downloaded.read_bytes()).hexdigest()
          if actual != expected or downloaded.stat().st_size != 186141158:
              raise RuntimeError('GitHub release download does not match the original ZIP')
          path = Path('production/complete-library-verification.json')
          report = json.loads(path.read_text())
          report.update({
              'status': 'complete',
              'remote_git_files_verified': 1323,
              'github_release_zip_verified': True,
              'github_release_zip_sha256': actual,
              'github_release_zip_bytes': downloaded.stat().st_size,
              'github_release': 'https://github.com/BradleyMatera/shopify-assets/releases/tag/complete-asset-pack-2026-11-01',
              'verification_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          })
          path.write_text(json.dumps(report, indent=2) + '\n')
          print('RELEASE_READBACK_VERIFIED: exact original ZIP downloaded from GitHub')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Complete asset package verified\n\nAll **1,323** original files are in `complete-library/`, including **1,302** registered media exports. Every Git blob matches the original. The original ZIP was uploaded to the release, downloaded again, and matched its SHA-256. Existing assets were preserved.\n')
          PY
      - name: Record final verification and confirm the remote tree again
        shell: bash
        run: |
          set -euo pipefail
          git add production/complete-library-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record successful remote verification of all assets and original ZIP'
          fi
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then pushed=true; break; fi
          done
          test "$pushed" = true
          git fetch origin main
          python scripts/import_complete_archive.py --verify-ref origin/main
