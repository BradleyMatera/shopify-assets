name: Rebuild reviewed asset library
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-production-main
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image, typography and motion tools
        run: |
          python -m pip install Pillow numpy cairosvg
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
      - name: Require an approved source registry
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          reviews=json.loads(Path('production/approved-sources.json').read_text())
          for item in reviews['sources']:
              path=Path(item['path'])
              assert path.is_file(),f'Missing approved source: {path}'
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256'],f'Unreviewed change: {path}'
          print('Approved source hashes verified')
          PY
      - name: Build actual media and preview files
        run: |
          python scripts/build_library.py
          python scripts/build_preview.py
      - name: Commit generated binaries
        run: |
          git config user.name 'Real Mall Asset Production'
          git config user.email '162147754+BradleyMatera@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild production exports from reviewed source images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: real-mall-production-assets
          path: |
            assets/
            production/
            preview/
            theme/
            email/
            docs/
            scripts/
            index.html
            README.md
          if-no-files-found: error
