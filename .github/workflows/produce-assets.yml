name: Produce and commit real asset files
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - production/**
      - .github/workflows/produce-assets.yml
permissions:
  contents: write
concurrency:
  group: asset-production-main
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and motion tools
        run: |
          python -m pip install Pillow numpy cairosvg
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Create independent campaign image files
        run: python scripts/produce_photography.py
      - name: Build responsive exports and supporting assets
        if: always()
        run: |
          if [ -f scripts/build_library.py ]; then python scripts/build_library.py; fi
      - name: Commit generated binaries into this repository
        if: always()
        run: |
          git config user.name 'Real Mall Asset Production'
          git config user.email '162147754+BradleyMatera@users.noreply.github.com'
          git add assets production README.md docs index.html preview theme email 2>/dev/null || git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add generated photography, production media, and verified asset inventory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package the actual produced files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mall-production-assets
          path: |
            assets/
            production/
            preview/
            theme/
            email/
            index.html
            README.md
          if-no-files-found: error
